spring.application.name=solicitudes_service
server.port=8082

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:solicitudesdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

rutalimpia.auth.url=http://localhost:8081
rutalimpia.sqs.region=us-east-1
rutalimpia.sqs.queue-url=https://sqs.us-east-1.amazonaws.com/TU_CUENTA/solicitudes-asignacion